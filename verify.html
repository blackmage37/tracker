<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Match Verification</title>
  <style>
    :root {
      --bg: #0b0f19; --card: #151d30; --border: #232f48;
      --accent: #10b981; --text: #f8fafc; --muted: #94a3b8; --warning: #f59e0b;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    h2, h3 { margin: 0 0 10px 0; }
    label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 6px; }
    input, button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #0b0f19; color: var(--text); font-size: 1rem; margin-bottom: 10px; }
    button { background: var(--accent); color: #000; font-weight: bold; border: none; cursor: pointer; }
    .conflict-card { border-left: 4px solid var(--warning); background: #1a2234; padding: 14px; border-radius: 0 8px 8px 0; margin-bottom: 12px; }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    .btn-approve { background: var(--accent); color: #000; padding: 8px; border-radius: 6px; }
    .btn-reject { background: #7f1d1d; color: #fff; padding: 8px; border-radius: 6px; }
    .back-link { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-link">← Back to Standings</a>
  <h2>🛡️ Admin Verification</h2>

  <!-- PASSKEY LOGIN GATE -->
  <div class="card" id="loginCard">
    <label>Admin Passkey</label>
    <form onsubmit="fetchConflicts(event)">
      <input type="password" id="adminPasskey" placeholder="Enter admin passkey..." required>
      <button type="submit" id="loginBtn">Unlock Conflicts</button>
    </form>
  </div>

  <!-- CONFLICT LIST -->
  <div class="card" id="drawer" style="display: none;">
    <h3 id="welcomeMsg" style="color: var(--warning);">Pending Conflicts</h3>
    <div id="pendingList"></div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby9ivt59JuMd-Wcso53XiYQtPUE1uPjAWxDlMC5OxwPSQC_l6KT0os59yxdzlPYBug4BA/exec";
  let activePasskey = "";

  async function fetchConflicts(e) {
    if (e) e.preventDefault();
    const key = document.getElementById("adminPasskey").value.trim();
    if (!key) return;

    const btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.innerText = "Checking...";

    try {
      const res = await fetch(`${SCRIPT_URL}?action=get_pending_conflicts&passkey=${encodeURIComponent(key)}`);
      const json = await res.json();

      if (json.status === "success") {
        activePasskey = key;
        document.getElementById("loginCard").style.display = "none";
        document.getElementById("drawer").style.display = "block";
        document.getElementById("welcomeMsg").innerText = `Logged in as: ${json.adminName}`;
        renderList(json.pending);
      } else {
        alert(json.message);
      }
    } catch (err) {
      alert("Network or script error: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "Unlock Conflicts";
    }
  }

  function renderList(pending) {
    const container = document.getElementById("pendingList");
    if (!pending || pending.length === 0) {
      container.innerHTML = `<p style="color: var(--muted);">No pending duplicate disputes found.</p>`;
      return;
    }

    container.innerHTML = pending.map(m => `
      <div class="conflict-card">
        <strong>${m.MatchID} — Date: ${m.MatchDate}</strong><br>
        <span style="font-size: 0.85rem; color: var(--muted);">Submitted by: <em>${m.UpdatedBy}</em></span>
        <div style="margin: 8px 0; font-size: 0.95rem;">
          🔴 Red (${m.RedCaptain}) <strong>${m.RedScore}</strong> - <strong>${m.BlueScore}</strong> Blue (${m.BlueCaptain}) 🔵
        </div>
        <div class="actions">
          <button class="btn-approve" onclick="resolveMatch('${m.MatchID}', 'VERIFIED')">Approve Match</button>
          <button class="btn-reject" onclick="resolveMatch('${m.MatchID}', 'REJECTED')">Reject</button>
        </div>
      </div>
    `).join("");
  }

  async function resolveMatch(matchId, status) {
    if (!confirm(`Mark ${matchId} as ${status}?`)) return;

    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "update_status",
          matchId: matchId,
          newStatus: status,
          passkey: activePasskey
        })
      });
      const result = await res.json();
      alert(result.message);
      fetchConflicts(); // Reload list
    } catch (e) {
      alert("Error: " + e.message);
    }
  }
</script>
</body>
</html>
