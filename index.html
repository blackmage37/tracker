<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚽ Football League - Standings</title>
  <style>
    :root { --bg: #0b0f19; --card: #151d30; --border: #232f48; --accent: #10b981; --text: #f8fafc; --muted: #94a3b8; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 16px; }
    .nav { display: flex; gap: 10px; margin-bottom: 4px; }
    .nav a { flex: 1; text-align: center; text-decoration: none; padding: 10px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; }
    .btn-update { background: var(--accent); color: #000; }
    .btn-verify { background: #334155; color: var(--text); border: 1px solid var(--border); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; overflow-x: auto; }
    h2, h3 { margin: 0 0 12px 0; font-size: 1.15rem; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th { color: var(--muted); padding: 8px 6px; border-bottom: 1px solid var(--border); font-size: 0.75rem; text-transform: uppercase; }
    td { padding: 10px 6px; border-bottom: 1px solid #1c2438; }
    tr:last-child td { border-bottom: none; }
    .num { text-align: center; }
    .pts { font-weight: bold; color: var(--accent); text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <div class="nav">
    <a href="update.html" class="btn-update">➕ Log Match</a>
    <a href="verify.html" class="btn-verify">🛡️ Admin Verify</a>
  </div>

  <div class="card">
    <h3>🏆 Captain Standings</h3>
    <table id="leagueTable">
      <thead>
        <tr>
          <th>Captain</th>
          <th class="num">P</th>
          <th class="num">W</th>
          <th class="num">D</th>
          <th class="num">L</th>
          <th class="num">GD</th>
          <th class="pts">Pts</th>
        </tr>
      </thead>
      <tbody><tr><td colspan="7">Loading standings...</td></tr></tbody>
    </table>
    <!-- Tiebreaker note container -->
    <p id="tiebreakerRule" style="font-size: 0.78rem; color: var(--muted); margin-top: 12px; margin-bottom: 0; line-height: 1.4;"></p>
  </div>

  <div class="card">
    <h3>👟 Golden Boot</h3>
    <table id="rankTable">
      <thead>
        <tr>
          <th>Player</th>
          <th class="num">Goals</th>
          <th class="num">Apps</th>
        </tr>
      </thead>
      <tbody><tr><td colspan="3">Loading scorers...</td></tr></tbody>
    </table>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby9ivt59JuMd-Wcso53XiYQtPUE1uPjAWxDlMC5OxwPSQC_l6KT0os59yxdzlPYBug4BA/exec";

  async function loadStandings() {
    try {
      const res = await fetch(`${SCRIPT_URL}?action=get_public_tables`);
      const data = await res.json();
      if (data.status === "success") {
        renderLeague(data.league);
        renderRank(data.rank);

        // Display the tiebreaker rule if returned from the Sheet
        const ruleEl = document.getElementById("tiebreakerRule");
        if (data.tiebreakerNote) {
          ruleEl.innerText = "ℹ️ " + data.tiebreakerNote;
        }
      }
    } catch (e) {
      console.error("Failed to load tables:", e);
    }
  }

  function renderLeague(rows) {
    const tbody = document.querySelector("#leagueTable tbody");
    if (!rows || rows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7">No matches recorded yet.</td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map(r => `
      <tr>
        <td><strong>${r.Captain || r.captain || "-"}</strong></td>
        <td class="num">${r.P || 0}</td>
        <td class="num">${r.W || 0}</td>
        <td class="num">${r.D || 0}</td>
        <td class="num">${r.L || 0}</td>
        <td class="num">${r.GD || 0}</td>
        <td class="pts">${r.Pts || 0}</td>
      </tr>
    `).join("");
  }

  function renderRank(rows) {
    const tbody = document.querySelector("#rankTable tbody");
    if (!rows || rows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="3">No goals logged yet.</td></tr>`;
      return;
    }
  
    // Normalize row data into numbers
    const cleaned = rows
      .map(r => ({
        player: r.Player || r.player || "-",
        goals: Number(r.Goals || r.goals || 0),
        apps: Number(r.Apps || r.apps || 0)
      }))
      .filter(r => r.player !== "-" && r.goals > 0);
  
    // Tiebreaker sort: Most goals first; if tied, FEWEST appearances first
    cleaned.sort((a, b) => {
      if (b.goals !== a.goals) {
        return b.goals - a.goals; // Primary: Goals Descending
      }
      return a.apps - b.apps;     // Tiebreaker: Apps Ascending (fewer apps = higher rank)
    });
  
    tbody.innerHTML = cleaned.map(r => `
      <tr>
        <td><strong>${r.player}</strong></td>
        <td class="pts">${r.goals}</td>
        <td class="num">${r.apps}</td>
      </tr>
    `).join("");
  }

  loadStandings();
</script>
</body>
</html>
